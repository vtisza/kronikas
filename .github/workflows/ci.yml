name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, to catch breakage from new PyMC/pytensor releases.
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint and format check
        run: make check

      - name: Type check
        run: make typecheck

  test:
    name: fast tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          # Spot-check a second platform without multiplying the whole matrix.
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run fast tests
        run: make test-fast

  test-sampling:
    # The fast suite deselects every MCMC test, which would leave
    # build_model -> run_inference -> extract_results entirely unexercised.
    # This job runs the whole suite so the sampling path is covered too.
    name: full test suite (with MCMC)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run full test suite
        run: make test

  build:
    name: build and verify the wheel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools_scm needs history to derive the version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - name: Build distributions
        run: uv build

      - name: Verify py.typed is packaged
        run: |
          python - <<'PY'
          import glob, sys, zipfile

          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          if "kronikas/py.typed" not in names:
              sys.exit(f"py.typed missing from {wheel}")
          print(f"py.typed present in {wheel}")
          PY
