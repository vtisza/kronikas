[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kronikas"
dynamic = ["version"]
description = "Hierarchical Bayesian election forecasting from opinion polls"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pymc>=5.10",
    "arviz>=0.17",
    "xarray>=2022.6",
]

[project.optional-dependencies]
# Installable with pip: `pip install -e ".[dev]"`.
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

# PEP 735 group, so `uv sync --group dev` works as the docs describe. Kept in
# step with the `dev` extra above, which serves pip users.
[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
kronikas = "kronikas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Ship the PEP 561 marker in the wheel; without this the type hints are
# invisible to downstream type checkers. The skill files travel with it, so
# `kronikas skill install` works from a plain `pip install kronikas`.
[tool.setuptools.package-data]
kronikas = [
    "py.typed",
    "skill/*.md",
    "skill/references/*.md",
    "skill/assets/*",
    "skill/scripts/*",
]

[tool.setuptools_scm]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
markers = [
    "slow: tests that run MCMC sampling (deselect with '-m not slow')",
]

[tool.mypy]
python_version = "3.10"
files = ["src/kronikas"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
