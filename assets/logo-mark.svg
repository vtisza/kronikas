<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="kronikas">
  <title>kronikas</title>
  <!-- The stem: the fixed record of polls already taken. -->
  <rect x="9" y="7" width="8.5" height="50" rx="4.25" fill="#131A24"/>
  <!-- The arms: posterior trajectories fanning into the future. Together
       with the stem they read as a K; on their own, as a fan chart. -->
  <g fill="none" stroke="#E04E2A" stroke-linecap="round">
    <path d="M17.5 32 Q37 20 57 4"   stroke-width="3" opacity=".38"/>
    <path d="M17.5 32 Q36 27.5 53 17.5" stroke-width="3" opacity=".38"/>
    <path d="M17.5 32 Q36 24 56 10"  stroke-width="5.5"/>
    <path d="M17.5 32 Q36 40 56 54"  stroke-width="5.5"/>
    <path d="M17.5 32 Q36 36.5 53 46.5" stroke-width="3" opacity=".38"/>
    <path d="M17.5 32 Q37 44 57 60"  stroke-width="3" opacity=".38"/>
  </g>
</svg>
